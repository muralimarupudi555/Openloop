<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="p99 latency by offered load">
<rect width="760" height="420" fill="#f7f9fc"/>
<style>text{font:400 13px Helvetica,Arial,sans-serif;fill:#39465e}.t{font-weight:600;font-size:16px}.s{font-size:11px;fill:#6b7890}</style>
<text class="t" x="80" y="26">p99 latency against offered load, no stall (E3, simulated)</text>
