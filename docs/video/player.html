const SEGMENTS = [{"cmd": "$ python -m openloop.cli compare --seed 7 --duration-s 20 --rate-rps 200 --workers 8 --server-capacity 16", "out": "generator     sent  omitted    p50 ms    p99 ms   p99.9 ms    max ms\n--------------------------------------------------------------------\nopen          4005        0      9.69     17.20      20.16     23.49\nclosed        4001        0      9.69     17.20      20.16     23.49\n\nclosed-loop p99 understates open-loop p99 by 1.0x; 0 intended requests were never sent\n", "dur": 0.6, "code": 0},{"cmd": "$ python -m openloop.cli compare --seed 7 --duration-s 20 --rate-rps 200 --workers 8 --server-capacity 16 --stall-start-s 5 --stall-duration-s 0.5 --stall-period-s 10", "out": "generator     sent  omitted    p50 ms    p99 ms   p99.9 ms    max ms\n--------------------------------------------------------------------\nopen          4005        0      9.88    442.60     498.44    509.42\nclosed        3814      187      9.50     18.26     498.44    507.14\n\nclosed-loop p99 understates open-loop p99 by 24.2x; 187 intended requests were never sent\n", "dur": 0.6, "code": 3},{"cmd": "$ python -m openloop.cli run --generator closed --json --seed 7 --duration-s 20 --rate-rps 200 --workers 8 --server-capacity 16 --stall-start-s 5 --stall-duration-s 0.5 --stall-period-s 10", "out": "{\n  &quot;generator&quot;: &quot;closed&quot;,\n  &quot;intended&quot;: 4001,\n  &quot;sent&quot;: 3814,\n  &quot;completed&quot;: 3814,\n  &quot;omitted&quot;: 187,\n  &quot;omitted_fraction&quot;: 0.046738,\n  &quot;percentiles_ms&quot;: {\n    &quot;50.0&quot;: 9.497,\n    &quot;90.0&quot;: 13.298,\n    &quot;99.0&quot;: 18.255,\n    &quot;99.9&quot;: 498.441\n  },\n  &quot;max_ms&quot;: 507.141\n}\n", "dur": 0.6, "code": 3},{"cmd": "$ make experiments", "out": "python3 experiments/e1_null.py\n\nE1 null result: no stall\n------------------------\nopen p50 ms     9.69\nclosed p50 ms   9.69\np50 delta %     0.00\np99 delta %     0.00\nclosed omitted  0\npyth de": 1}];
const term = document.getElementById("term");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function trim() {
  while (term.scrollHeight > term.clientHeight && term.firstChild) {
    term.removeChild(term.firstChild);
  }
}
async function typeLine(text) {
  const span = document.createElement("span");
  span.className = "cmd";
  term.appendChild(span);
  for (const ch of text) { span.textContent += ch; trim(); await sleep(14); }
  term.appendChild(document.createTextNode("\n"));
}
async function play() {
  for (const seg of SEGMENTS) {
    await typeLine(seg.cmd);
    await sleep(250);
    const lines = seg.out.split("\n");
    const per = Math.min(90, (seg.dur * 1000) / Math.max(lines.length, 1));
    for (const line of lines) {
      term.appendChild(document.createTextNode(line + "\n"));
      trim();
      await sleep(per);
    }
    const code = document.createElement("span");
    code.className = "code";
    code.textContent = "exit code " + seg.code + "\n\n";
    term.appendChild(code);
    trim();
    await sleep(700);
  }
  document.title = "DONE";
}
play();
</script>
