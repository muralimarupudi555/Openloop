<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="openloop: the latency your load test cannot see">
  <style>
    .title { font: 700 54px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e8edf5; }
    .accent { fill: #5eead4; }
    .tag { font: 400 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9fb0c7; }
    .lane-label { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #7e90aa; }
    .stall-label { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2a3a3; }
    .open-flow { stroke: #5eead4; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 0.1 26; fill: none;
                 animation: flow 2.4s linear infinite; }
    .closed-flow { stroke: #f2b65e; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 0.1 26; fill: none;
                   animation: stutter 2.4s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -52.2; } }
    @keyframes stutter {
      0%   { stroke-dashoffset: 0; }
      38%  { stroke-dashoffset: -20; }
      62%  { stroke-dashoffset: -20; }
      100% { stroke-dashoffset: -52.2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .open-flow, .closed-flow { animation: none; }
    }
  </style>
  <rect x="0" y="0" width="960" height="260" fill="#0e1726"/>
  <rect x="0" y="0" width="960" height="4" fill="#5eead4" opacity="0.65"/>
  <text x="56" y="92" class="title">open<tspan class="accent">loop</tspan></text>
  <text x="58" y="128" class="tag">the latency your load test cannot see</text>

  <rect x="596" y="158" width="118" height="78" fill="#e05d5d" opacity="0.16"/>
  <rect x="596" y="158" width="118" height="2" fill="#e05d5d" opacity="0.7"/>
  <rect x="596" y="234" width="118" height="2" fill="#e05d5d" opacity="0.7"/>
  <text x="602" y="150" class="stall-label">server stall</text>

  <text x="56" y="180" class="lane-label">open loop keeps sending</text>
  <line x1="268" y1="175" x2="904" y2="175" class="open-flow"/>

  <text x="56" y="222" class="lane-label">closed loop stops looking</text>
  <line x1="268" y1="217" x2="904" y2="217" class="closed-flow"/>
</svg>
