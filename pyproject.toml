[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openloop"
version = "1.0.0"
description = "Measures how much a closed-loop load generator under-reports tail latency through coordinated omission."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Murali Marupudi", email = "muralimarupudi@mycvcareer.com" }]
keywords = ["latency", "load-testing", "coordinated-omission", "benchmarking", "tail-latency"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing :: Traffic Generation",
]
dependencies = []

[project.optional-dependencies]
wall = ["fastapi>=0.110", "httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
openloop = "openloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["openloop"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
